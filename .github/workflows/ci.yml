name: ci
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.4-alpine
        env:
          POSTGRES_USER: tandem
          POSTGRES_PASSWORD: tandem
          POSTGRES_DB: tandem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tandem -d tandem_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: generate swagger docs
        run: go run github.com/swaggo/swag/v2/cmd/swag init -g ./cmd/server/main.go -o ./docs --v3.1
      - name: check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        env:
          TEST_DATABASE_URL: postgres://tandem:tandem@localhost:5432/tandem_test?sslmode=disable
        run: go test ./... -count=1