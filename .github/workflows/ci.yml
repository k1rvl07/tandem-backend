name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.4-alpine
        env:
          POSTGRES_USER: tandem
          POSTGRES_PASSWORD: tandem
          POSTGRES_DB: tandem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tandem -d tandem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        command: redis-server --requirepass secret_redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a secret_redis ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: bitnamilegacy/minio:2024.5.28
        env:
          MINIO_ROOT_USER: tandem
          MINIO_ROOT_PASSWORD: secret_minio
        ports:
          - 9000:9000
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: tandem
      POSTGRES_PASSWORD: tandem
      POSTGRES_DB: tandem
      REDIS_ADDR: 127.0.0.1:6379
      REDIS_PASSWORD: secret_redis
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ROOT_USER: tandem
      MINIO_ROOT_PASSWORD: secret_minio
      MINIO_BUCKET: tandem-files
      JWT_SECRET: ci_secret
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: adminpass
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27'
      - name: generate swagger docs
        run: |
          go install github.com/swaggo/swag/v2/cmd/swag@v2.0.0-rc5
          swag init -g ./cmd/server/main.go -o ./docs --v3.1
        working-directory: .
      - name: check backend formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -l .
            exit 1
          fi
      - name: vet backend
        run: go vet ./...
      - name: build backend
        run: go build ./...
      - name: scan backend for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: run backend unit tests
        run: go test -race -count=1 ./cmd/... ./internal/contracts/... ./internal/domain/... ./internal/http/... ./internal/infrastructure/... ./internal/pkg/... ./internal/repository/testutil/... ./internal/usecase/... ./internal/repository/board/... ./internal/repository/column/... ./internal/repository/user/... ./internal/repository/task/... ./internal/repository/taskext/... ./internal/repository/workspace/... ./internal/repository/postgres/... ./internal/pkg/migrations/...
      - name: create integration test database
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=tandem createdb -h 127.0.0.1 -U tandem tandem_test || true
      - name: run backend integration tests
        env:
          TEST_DATABASE_URL: postgres://tandem:tandem@127.0.0.1:5432/tandem_test?sslmode=disable
          TEST_REDIS_ADDR: 127.0.0.1:6379
          TEST_REDIS_PASSWORD: secret_redis
          TEST_MINIO_ENDPOINT: 127.0.0.1:9000
          TEST_MINIO_ROOT_USER: tandem
          TEST_MINIO_ROOT_PASSWORD: secret_minio
          TEST_MINIO_BUCKET: tandem-files
        run: go test -count=1 ./internal/app ./internal/repository/... ./internal/pkg/migrations/...
